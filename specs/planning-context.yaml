# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "upareal v1 — personal budget web app"
problem_statement: >
  Individuals need a private personal budget app that tracks their real money with
  double-entry bookkeeping (signed amounts, every transaction sums to zero) and plans
  each month with envelope (zero-based, YNAB-style) budgeting. It is a responsive web
  app (desktop and mobile) for many independent users in Brazil, signing in with Google.
  Financial data must stay private (LGPD) and be unreadable if the database file or
  backups leak.

architecture:
  module: github.com/upareal/upareal
  shape: one Go binary, one deploy, one SQLite database
  packages:
    users: "public package at repo root — Google sign-in, sessions, admin, self-service export/delete"
    ledger: "public package at repo root — money movement only: accounts, transactions, legs, imports"
    budget: "public package at repo root — categories (one level of groups) and the amount allowed/expected per category per month; knows nothing about real money"
    planning: "public package at repo root — joins ledger and budget: maps ledger accounts to budget categories and computes spent, available, carry-over, to be assigned, card payment envelopes; goals later"
    web: "templ + HTMX; imports the modules; only layer that renders HTML"
    internal: "shared code within this repo only (db helpers, config, crypto)"
  future_split: "each module may move to its own repo (e.g. upareal-planning-svc) that instantiates the service and API"
  module_rules:
    - "modules contain no HTML"
    - "each module owns its goose migrations, sqlc queries, goose version table (goose_<module>) and table prefix (<module>_*)"
    - "no foreign keys between modules (user_id is a plain UUID column); foreign keys inside a module are kept"
    - "cross-module integrity in Go (e.g. account deletion calls each module's DeleteUserData(userID))"
    - "migrations run at startup in order: users, ledger, budget, planning"

domain:
  users:
    - "Google OIDC only via github.com/coreos/go-oidc/v3 + golang.org/x/oauth2; scopes openid email profile; first login creates the user"
    - "returning users are recognized by Google sub (HMAC blind index of sub); email stored encrypted, no email index"
    - "only Google accounts with email_verified=true may sign in"
    - "server-side sessions: 32 random bytes, only SHA-256 hash stored; HttpOnly+Secure+SameSite=Lax cookie"
    - "session expiry: 30 days idle, 90 days absolute; logout and log out of all devices"
    - "admin role only from ADMIN_EMAILS env var; ADMIN_EMAILS users cannot be disabled/deleted via UI"
    - "admins list, disable, delete users; cannot see users' financial data"
    - "disable/delete removes the user's sessions immediately; disabled users cannot sign in"
    - "self-service export my data and delete my account in v1"
    - "terms acceptance stored (terms_version + accepted_at); new version asks again"
  ledger:
    - "ledger stores money movement only: accounts and transactions (no categories, no groups)"
    - "account types: asset, liability, income, expense, equity; users create accounts of every type as they go"
    - "new users get only system accounts: 'Saldo inicial' (equity) for opening balances and manual adjustments, 'A categorizar' (income) and 'A categorizar' (expense) for imported lines"
    - "amounts: signed int64 centavos, BRL only; positive increases, negative decreases an account"
    - "every transaction's legs sum to zero; unbalanced transactions are never saved"
    - "full split transactions (multi-leg) in form and review queue; one description per transaction"
    - "plain editing with encrypted transaction_history; soft delete (deleted_at)"
    - "asset/liability accounts have on_budget flag; credit cards always on-budget; off-budget accounts only in balances/net worth"
    - "archive accounts only at zero balance; hard delete only for accounts never used (no legs)"
    - "display order via plaintext position INTEGER on accounts"
  import:
    - "bank stored on each account; one parser per supported bank (best format the bank offers) behind a small Parser interface"
    - "generic CSV fallback with documented column order, formats and example file"
    - "generic CSV format: UTF-8, ';' separator, header row required but ignored; columns by position: id;data;hora;descricao;valor;conta"
    - "id = row id (dedupe per account); data = dd/mm/aaaa; hora = hh:mm or empty (00:00 Sao Paulo); valor = pt-BR decimal, negative = money left the account; conta = optional free text kept encrypted for future auto-categorization, never matched to accounts; trailing empty conta column may be omitted"
    - "all parsers return the same Line (import id, time, description, amount in centavos)"
    - "imported lines go to a review queue with second leg on Uncategorized income/expense"
    - "dedupe by OFX FITID or CSV row id, per account"
    - "transfer matching in review queue: opposite amount, ±3 days, user confirms; both import ids recorded"
    - "limits: 5 MB and 10.000 lines per file; all-or-nothing validation with line-numbered errors"
    - "OFX: handle 1.x SGML and 2.x XML; transcode Latin-1/Windows-1252 to UTF-8 BEFORE ofxgo.ParseResponse (ofxgo ignores CHARSET)"
  budget:
    - "categories are expense or income; one level of grouping: Category Group -> Category"
    - "new users get the default grouped pt-BR categories (10 groups, 37 categories), editable"
    - "stores the amount allowed/expected per category per month (e.g. Combustivel, January, R$ 300,00); does not know where real money comes from"
    - "a new month starts as a copy of the previous month's amounts"
    - "archive categories only when their planning envelope is zero (user merges or moves money first); merge moves amounts to the target category"
    - "display order via plaintext position INTEGER on groups and categories"
  planning:
    - "maps ledger income/expense accounts to budget categories: each account maps to at most one category; a category can have many accounts"
    - "v1 maps only income/expense accounts (open: whether asset/liability accounts may be mapped)"
    - "spent of a category in a month = sum of legs on its mapped ledger accounts; unmapped accounts are shown as 'Sem categoria' so no money is left out"
    - "envelope (zero-based) budgeting: to be assigned = income received - amounts assigned"
    - "available = amount + carry-over - spent; leftovers carry over; overspending reduces next month"
    - "credit cards: card spending reduces its category and A distribuir excludes card debt, so each card's payment envelope (Para pagar) is its debt; Sem cobertura = debt that cash cannot back after A distribuir and positive envelopes (e08s04)"
    - "off-budget transfers need a category; inflows from off-budget become money to assign"
    - "everything derived is computed, never stored; editing past months recomputes carry-over"
    - "goals (later) will be referenced by planning"
  invariants:
    ledger:
      - "L1 every transaction has at least 2 legs and the legs sum to zero"
      - "L2 a leg amount is non-zero int64 centavos (BRL)"
      - "L3 all legs of a transaction belong to accounts of the same user"
      - "L4 an account balance is the sum of its legs, never stored"
      - "L5 an account type cannot change once it has legs"
      - "L6 archived accounts take no new legs"
      - "L7 system accounts cannot be deleted or archived"
    budget:
      - "B1 one level of groups; a category belongs to exactly one group; groups do not nest"
      - "B2 a category kind (expense|income) matches its group kind"
      - "B3 at most one amount per (category, month); months are calendar months in America/Sao_Paulo"
      - "B4 amounts are int64 centavos >= 0"
    planning:
      - "P1 a ledger account maps to at most one category"
      - "P2 kinds match: income account -> income category, expense account -> expense category"
      - "P3 unmapped accounts appear as 'Sem categoria'; no money is left out of totals"
      - "P4 derived values (spent, available, carry-over, to be assigned, card envelopes) are computed, never stored"
    cross_module:
      - "X1 modules reference each other by ID only, no foreign keys; a deleted category or account drops its mappings (account becomes Sem categoria)"
      - "X2 every row belongs to exactly one user; every query filters by user_id"

data_conventions:
  - "IDs: UUIDv7 via github.com/google/uuid (uuid.NewV7), stored as TEXT(36); always scoped by user_id"
  - "all times stored in UTC (including transaction occurred_at); displayed in America/Sao_Paulo"
  - "day/month membership always computed in America/Sao_Paulo; date-only import lines stored at 00:00 America/Sao_Paulo"
  - "binary imports time/tzdata"
  - "UI pt-BR (R$ 1.234,56, dd/mm/aaaa); code, logs and README in English"

privacy_security:
  - "LGPD applies"
  - "field-level AES-256-GCM encryption of sensitive text (email, names, account/category names, descriptions, history, import payloads)"
  - "per-user data keys wrapped by a master key, with key version for rotation; deleting the user key crypto-shreds data in backups"
  - "HMAC blind indexes for Google sub lookup and import dedupe ids"
  - "encryption key and HMAC key are derived from the single master key with stdlib crypto/hkdf (distinct info labels)"
  - "amounts and dates stay plaintext"
  - "text search: filter in SQL on plaintext columns, decrypt and search/sort in Go; search always date-bounded (default last 12 months)"
  - "isolation tests prove user A can never read user B's data"
  - "encrypted EBS volume and S3 bucket; HTTPS only; CSRF protection via stdlib net/http.CrossOriginProtection (no tokens)"
  - "logs never contain amounts, descriptions or emails; only user ids"
  - "limited Litestream retention (e.g. 30 days)"
  - "static pages /, /privacidade, /termos (templ, pt-BR) for Google OAuth consent screen publishing"

tech_stack:
  - "Go; templ; HTMX (vendored under web/static, no CDN)"
  - "github.com/coreos/go-oidc/v3 + golang.org/x/oauth2 for Google sign-in"
  - "SQLite via modernc.org/sqlite (no CGO); PRAGMA foreign_keys = ON in DSN"
  - "goose (library, embedded SQL migrations); sqlc"
  - "github.com/aclindsa/ofxgo (pinned v0.1.3, covered by fixture tests) for OFX; golang.org/x/text/encoding/charmap for charset transcoding"
  - "log/slog JSON to stdout"

operations:
  - "Docker-first: easy local dev, CI and AWS hosting"
  - "AWS: single EC2 instance, Docker Compose: caddy (TLS, Let's Encrypt) -> app"
  - "app entrypoint: litestream restore -if-replica-exists, then litestream replicate -exec the app; WAL streamed to S3"
  - "SQLite on encrypted EBS volume; single instance only"
  - "AWS access via EC2 instance role (SSM read, S3 write); no access keys on disk"
  - "local dev: compose override without Caddy/Litestream, http://localhost:8080"
  - "config from env vars only, read into a Config struct at startup, fail fast on missing values"
  - "secrets (GOOGLE_CLIENT_SECRET, master key): from SSM SecureString when *_SSM_PARAM is set, otherwise from env var; never in a .env file"
  - "tests and CI use no real secrets: random master key per run and a fake OIDC provider (httptest)"
  - "/healthz (SELECT 1) used by Docker healthcheck"
  - "graceful shutdown on SIGTERM (10s drain, close DB)"
  - "make restore-test: restore S3 replica to temp dir and run PRAGMA integrity_check"
  - "master key also backed up offline (e.g. password manager)"

success_criteria:
  - "user signs in with Google; account created with default grouped categories"
  - "user creates a checking account with an opening balance"
  - "user imports a bank file; lines land in the review queue; re-importing adds nothing"
  - "user categorizes queued lines (including splits and transfers) or enters transactions manually"
  - "user assigns income to categories until money to assign is R$ 0"
  - "budget view shows assigned, spent and available per category; next month copies the plan with carry-over and overspending applied"
  - "admin from ADMIN_EMAILS lists, disables and deletes users; disabled users cannot sign in"
  - "all of the above works on a phone-sized screen"
  - "an unbalanced transaction is never saved"
  - "user A can never read user B's data"
  - "self-service export and account deletion work"
  - "a copy of the database contains no plaintext names, emails or descriptions"

constraints:
  - "single binary, single SQLite file, single instance"
  - "BRL only; Brazil-only locale and time zone, no settings in v1"
  - "Google is the only login method"
  - "modules must stay splittable into separate repos"

out_of_scope:
  never:
    - "automatic bank sync (Open Finance, aggregators)"
    - "native mobile apps"
    - "login methods other than Google"
  later:
    - "auto-categorization rules"
    - "reconciliation (cleared/reconciled status)"
    - "admin audit log"
    - "recurring transactions"
    - "reports and charts beyond budget view and balances"
    - "attachments"
    - "sharing budgets between users"
    - "multiple currencies"
    - "i18n / per-user locale and time zone"
    - "per-leg memos"
    - "monitoring and alerts"
    - "row-level AAD binding for encrypted fields (revisit before e06 stores transaction descriptions; format change)"
    - "offline PWA"

open_items:
  - "list of supported banks and their export formats (per account type)"
  - "privacy policy and terms of service text"
  - "domain name"

key_decisions:
  - decision: "one binary with public modules users, ledger, budget, planning at repo root"
    rationale: "simple to run now; public packages can be imported by future per-module service repos (internal/ cannot)"
  - decision: "web/ layer with templ + HTMX renders all HTML"
    rationale: "modules stay UI-free and easy to split"
  - decision: "SQLite on EC2 with Litestream to S3"
    rationale: "one file, no DB server, cheap; EFS/Fargate unsafe for SQLite locking"
  - decision: "everything in the ledger is an account, including equity for opening balances"
    rationale: "real double-entry"
  - decision: "YNAB-style envelope budgeting with credit card payment envelopes"
    rationale: "avoids budgeting card spending twice"
  - decision: "application field-level encryption with per-user keys wrapped by a master key in SSM Parameter Store"
    rationale: "protects leaked DB/backups at near-zero cost; crypto-shredding covers LGPD deletion in backups"
  - decision: "amounts and dates in plaintext"
    rationale: "SQLite keeps sums and the zero-sum check"
  - decision: "each module owns schema and migrations, no cross-module foreign keys"
    rationale: "modules can move to their own repos without untangling the schema"
  - decision: "all times stored in UTC, month logic in America/Sao_Paulo"
    rationale: "one storage rule; correct month boundaries for Brazilian users"
  - decision: "secrets from SSM or env, never .env files"
    rationale: "no plaintext secrets on disk"
  - decision: "local-first delivery: e01 runs over plain HTTP with master key from config; HTTPS, SSM secrets and Litestream backups ship in the last epic (e10-production)"
    rationale: "build and test the whole app locally before paying the infrastructure setup cost"
  - decision: "Google sign-in via coreos/go-oidc + x/oauth2"
    rationale: "hand-rolled ID token / JWKS verification is a security risk (see specs/product/PRIOR_ART_LATEST.md)"
  - decision: "CSRF via stdlib net/http.CrossOriginProtection"
    rationale: "Go 1.25+ stdlib; no tokens to thread through forms and HTMX requests; no dependency"
  - decision: "transcode OFX charset to UTF-8 before ofxgo parses it"
    rationale: "ofxgo v0.1.3 passes input through unchanged; Brazilian banks often send CHARSET:1252"
  - decision: "derive encryption and HMAC keys from the master key with crypto/hkdf"
    rationale: "one secret to store and back up; separate keys per purpose"
  - decision: "encrypted fields are bound to user + field, not row (row binding deferred)"
    rationale: "swapping values between rows needs DB write access, which already allows worse attacks; low value for v1"
  - decision: "identify users by Google sub, not email"
    rationale: "sub is permanent; emails can change or be reassigned, which would split or hijack accounts"
  - decision: "local dev secrets pass through from the shell environment (make run, compose)"
    rationale: "nothing on disk; matches the no-secrets-in-files rule"
  - decision: "require email_verified=true at sign-in"
    rationale: "an unverified address may belong to someone else"
  - decision: "each module keeps its own per-user data key (e.g. ledger_user_key), wrapped by the shared master key"
    rationale: "modules stay splittable; each module's DeleteUserData shreds its own key"
  - decision: "default categories via idempotent ledger.EnsureDefaults(userID) on every sign-in"
    rationale: "no change to users API; a failed first sign-in self-heals on the next"
  - decision: "SQLite write transactions use _txlock=immediate"
    rationale: "concurrent writers wait for the lock up front instead of racing read-then-write"
  - decision: "SUPERSEDES 'categories are income/expense ledger accounts': categories live in a separate budget module; planning maps ledger accounts to categories (2026-10-07)"
    rationale: "ledger records money movement only; budget records intent; planning joins them and will host goals"
  - decision: "keep YNAB-style card payment envelopes, computed by planning"
    rationale: "user wants money set aside for card bills, as in YNAB"
  - decision: "new users get budget categories and ledger system accounts only; no default ledger income/expense accounts and no default mapping"
    rationale: "user creates ledger accounts as they go; unmapped accounts show as Sem categoria"
  - decision: "stored amounts are debit-positive: assets and expenses grow with positive legs, liabilities, income and equity with negative legs; the UI shows liabilities as amount owed and income as amount earned (positive)"
    rationale: "matches every example agreed during elaboration (e.g. Mercado +15000 | Conta corrente -15000; Cartao -20000 on purchase); one sign rule for all sums"
  - decision: "liability accounts carry is_card; cards are always on-budget, loans choose; asset accounts choose on_budget"
    rationale: "planning (e08s04) needs to know which liabilities get card payment envelopes"
  - decision: "generic CSV is positional (id;data;hora;descricao;valor;conta); the header is required but ignored; columns in the wrong order are not corrected"
    rationale: "simple contract; the optional conta text is stored encrypted for future auto-categorization"

domain_change:
  raised: 2026-10-07, during e04s01 UAT
  user_statement: 'ledger keeps only accounts and transactions (money movement). Categories and groups belong to a new module "budget": a category can be
    fed by more than one account; categories have one level of grouping. Module "planning" reads ledger and budget; future goals will be referenced by planning.
    User also said some invariants were not described yet.'
  impact: e04s01 (unmerged, on feat/e04-accounts-categories) put groups/categories in ledger; must move to budget. planning-context and epics e04-e07 need
    revision.
  open_questions:
  - 'which ledger account types may be mapped (default v1: income/expense only)'
  - credit card envelopes under the new split
  - default data per module
  - the missing invariants
  answers:
    q1_fed_by: budget categories store allowed/expected amounts per month (e.g. Combustivel, January, R$ 300,00); budget does not know where real money
      comes from. planning maps budget categories to ledger accounts and joins budget with ledger.
    users: unchanged (confirmed)
    ledger: accounts and transactions only (confirmed)
    q2_mapping: each ledger account maps to at most one budget category; a category can have many accounts; category spending = sum of its mapped accounts;
      unmapped accounts show as "Sem categoria" in planning
    q3_envelopes: 'envelope rules still apply. budget: amount per category per month; new month copies previous amounts. planning: spent (sum of mapped
      ledger accounts), available (amount + carry-over - spent), carry-over and overspending, to be assigned (income received - assigned). Nothing derived
      is stored.'

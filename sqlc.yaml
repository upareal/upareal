# story: e03s01 e04s01 e05s01 e08s01
# One entry per module; generated code stays private to the module (internal/store).
version: "2"
sql:
  - engine: sqlite
    schema: users/migrations
    queries: users/queries
    gen:
      go:
        package: store
        out: users/internal/store
  - engine: sqlite
    schema: ledger/migrations
    queries: ledger/queries
    gen:
      go:
        package: store
        out: ledger/internal/store
  - engine: sqlite
    schema: budget/migrations
    queries: budget/queries
    gen:
      go:
        package: store
        out: budget/internal/store
  - engine: sqlite
    schema: planning/migrations
    queries: planning/queries
    gen:
      go:
        package: store
        out: planning/internal/store

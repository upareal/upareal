# story: e01s02 e03s01
# Local development: plain HTTP on http://localhost:8080. No secrets here.
services:
  app:
    build: .
    image: upareal:dev
    ports:
      - "8080:8080"
    # Secrets pass through from your shell; nothing is stored in files.
    environment:
      DB_PATH: /data/upareal.db
      BASE_URL: http://localhost:8080
      MASTER_KEY: ${MASTER_KEY:?export MASTER_KEY (base64 of 32 bytes) in your shell}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?export GOOGLE_CLIENT_ID in your shell}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?export GOOGLE_CLIENT_SECRET in your shell}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - upareal-data:/data
    healthcheck:
      test: ["CMD", "/upareal", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 15s

volumes:
  upareal-data:
